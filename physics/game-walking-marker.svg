<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="180mm" viewBox="0 0 180 180">
  <title>Universe, In Person — original camera-walking marker</title>
  <desc>Place upright on a stationary wall. Print at 100 percent. The outer black square is 160 mm wide; measure its actual width and enter it in the game. This original pattern is not a QR code.</desc>
  <rect width="180" height="180" fill="white"/>
  <text x="90" y="5" text-anchor="middle" font-family="sans-serif" font-size="3" fill="black">TOP ↑ · 宇宙现场</text>
  <rect x="10" y="10" width="160" height="160" fill="black"/>
  <g fill="white">
    <rect x="63.333333" y="36.666667" width="26.666667" height="26.666667"/>
    <rect x="90" y="36.666667" width="26.666667" height="26.666667"/>
    <rect x="116.666667" y="36.666667" width="26.666667" height="26.666667"/>
    <rect x="63.333333" y="63.333333" width="26.666667" height="26.666667"/>
    <rect x="36.666667" y="90" width="26.666667" height="26.666667"/>
    <rect x="116.666667" y="90" width="26.666667" height="26.666667"/>
    <rect x="90" y="116.666667" width="26.666667" height="26.666667"/>
  </g>
  <text x="90" y="176" text-anchor="middle" font-family="sans-serif" font-size="3" fill="black">BLACK SQUARE: 16 cm at actual size · 黑框宽 16 cm</text>
</svg>
